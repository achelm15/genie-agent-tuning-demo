# Generated by scripts/build_agent_resources.py from genie_demo.py. Don't edit by hand.
resources:
  genie_spaces:
    r0_raw_tables:
      title: "${var.team.short_name} Pitching R0: raw tables"
      description: "Round 0. Six raw tables, no comments, keys, examples or instructions."
      warehouse_id: "${var.warehouse_id}"
      parent_path: "${var.workspace_folder}"
      serialized_space:
        version: 2
        data_sources:
          tables:
            - identifier: "${var.catalog}.${var.raw_schema}.gm"
            - identifier: "${var.catalog}.${var.raw_schema}.ld_log"
            - identifier: "${var.catalog}.${var.raw_schema}.pch"
            - identifier: "${var.catalog}.${var.raw_schema}.pgl"
            - identifier: "${var.catalog}.${var.raw_schema}.plyr"
            - identifier: "${var.catalog}.${var.raw_schema}.tm"
        benchmarks:
          questions:
            - id: "0ae57e38ebb27e205fcf2b1641e8a27d"
              question:
                - "What was the whiff rate on sweepers thrown by ${var.team.short_name} pitchers this season?"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(100.0 * SUM(CASE WHEN x.cd IN ('S','W','M') THEN 1 ELSE 0 END)\n"
                    - "                   / SUM(CASE WHEN x.cd IN ('S','W','T','F','L','M','O','X','D','E') THEN 1 ELSE 0 END), 1) AS whiff_pct\n"
                    - "FROM ${var.catalog}.${var.raw_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.raw_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND x.pt_cd = 'ST'"
            - id: "0bc504eb4d1e1e63582565b648e08738"
              question:
                - "${var.team.short_name} sweeper whiff %"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(100.0 * SUM(CASE WHEN x.cd IN ('S','W','M') THEN 1 ELSE 0 END)\n"
                    - "                   / SUM(CASE WHEN x.cd IN ('S','W','T','F','L','M','O','X','D','E') THEN 1 ELSE 0 END), 1) AS whiff_pct\n"
                    - "FROM ${var.catalog}.${var.raw_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.raw_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND x.pt_cd = 'ST'"
            - id: "101635b5bbb11117087eb1835c8e5a0b"
              question:
                - "Our staff's swing-and-miss rate on sweepers"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(100.0 * SUM(CASE WHEN x.cd IN ('S','W','M') THEN 1 ELSE 0 END)\n"
                    - "                   / SUM(CASE WHEN x.cd IN ('S','W','T','F','L','M','O','X','D','E') THEN 1 ELSE 0 END), 1) AS whiff_pct\n"
                    - "FROM ${var.catalog}.${var.raw_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.raw_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND x.pt_cd = 'ST'"
            - id: "1cea729d4c93fa64d42337df078bb43c"
              question:
                - "Who led our rotation in quality starts?"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT p.nm_full AS pitcher,\n"
                    - "       COUNT(*) AS quality_starts\n"
                    - "FROM ${var.catalog}.${var.raw_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.raw_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "JOIN ${var.catalog}.${var.raw_schema}.plyr p ON l.p_id = p.p_id\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND l.gs = 1 AND l.outs >= 18 AND l.er <= 3\n"
                    - "GROUP BY p.nm_full\n"
                    - "ORDER BY quality_starts DESC, pitcher\n"
                    - "LIMIT 1"
            - id: "1de76dc441dd6c248b92dc24820e92f5"
              question:
                - "What was the ${var.team.short_name} bullpen ERA in one-run games?"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(9 * SUM(l.er) / (SUM(l.outs) / 3.0), 2) AS bullpen_era\n"
                    - "FROM ${var.catalog}.${var.raw_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.raw_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND l.gs = 0\n"
                    - "  AND ABS(g.hm_r - g.aw_r) = 1"
            - id: "47d7c835a4caf0f978fb9a53f3275297"
              question:
                - "Top 5 ${var.team.short_name} relievers by strikeout rate in August, minimum 25 batters faced"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT p.nm_full AS pitcher,\n"
                    - "       ROUND(100.0 * SUM(l.so) / SUM(l.bf), 1) AS k_pct\n"
                    - "FROM ${var.catalog}.${var.raw_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.raw_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "JOIN ${var.catalog}.${var.raw_schema}.plyr p ON l.p_id = p.p_id\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND l.gs = 0\n"
                    - "  AND MONTH(g.gm_dt) = 8\n"
                    - "GROUP BY p.nm_full\n"
                    - "HAVING SUM(l.bf) >= 25\n"
                    - "ORDER BY k_pct DESC, pitcher\n"
                    - "LIMIT 5"
            - id: "55f469a0b422db0552f4a2c07dd6a9b9"
