            - id: "a6950b371df5436ab3e6de46dc99b223"
              question:
                - "Number of punchouts our staff recorded with a sweeper"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT COUNT(*) AS sweeper_strikeouts\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND x.pt_cd = 'ST'\n"
                    - "  AND x.is_lst = true\n"
                    - "  AND x.ev_typ IN ('strikeout', 'strikeout_double_play')"
            - id: "a7d6a588b92c28195597a7af94eb09b3"
              question:
                - "Who threw the hardest four-seamer on our staff on average (at least 200 thrown)?"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT p.nm_full AS pitcher,\n"
                    - "       ROUND(AVG(x.spd), 1) AS avg_ff_velo\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.plyr p ON x.p_id = p.p_id\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND x.pt_cd = 'FF'\n"
                    - "GROUP BY p.nm_full\n"
                    - "HAVING COUNT(*) >= 200\n"
                    - "ORDER BY avg_ff_velo DESC\n"
                    - "LIMIT 1"
            - id: "b4648937b14e285e1877bf96af8302e8"
              question:
                - "What was the ${var.team.short_name}' team ERA this season?"
