                    - "  AND x.ev IS NOT NULL"
            - id: "d88cdee9e022d61e65fa0d620ed440b0"
              question:
                - "What was the hard-hit rate allowed by ${var.team.short_name} pitchers at ${var.team.home_park}?"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(100.0 * SUM(CASE WHEN x.ev >= 95 THEN 1 ELSE 0 END) / COUNT(*), 1) AS hard_hit_pct\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND g.hm_tm_id = ${var.team.id}\n"
                    - "  AND x.cd IN ('X','D','E')\n"
                    - "  AND x.ev IS NOT NULL"
            - id: "e028f58148fdd7aeb557a16303beeb2a"
              question:
                - "Which ${var.team.short_name} starter had the most quality starts this season?"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT p.nm_full AS pitcher,\n"
                    - "       COUNT(*) AS quality_starts\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.plyr p ON l.p_id = p.p_id\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND l.gs = 1 AND l.outs >= 18 AND l.er <= 3\n"
                    - "GROUP BY p.nm_full\n"
                    - "ORDER BY quality_starts DESC, pitcher\n"
                    - "LIMIT 1"
            - id: "e65b71056601705ff05be2e23948d01d"
              question:
                - "What was the ${var.team.short_name} bullpen ERA in one-run games?"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(9 * SUM(l.er) / (SUM(l.outs) / 3.0), 2) AS bullpen_era\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND l.gs = 0\n"
                    - "  AND ABS(g.hm_r - g.aw_r) = 1"
            - id: "e681dc214eae8f6b7e24c797931f854c"
              question:
                - "Bullpen ERA in one-run games this season"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(9 * SUM(l.er) / (SUM(l.outs) / 3.0), 2) AS bullpen_era\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND l.gs = 0\n"
                    - "  AND ABS(g.hm_r - g.aw_r) = 1"
            - id: "ec9183f81892b914402d60814e148634"
              question:
                - "Which ${var.team.short_name} pitcher had the highest average four-seam fastball velocity? Minimum 200 four-seamers"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT p.nm_full AS pitcher,\n"
                    - "       ROUND(AVG(x.spd), 1) AS avg_ff_velo\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.plyr p ON x.p_id = p.p_id\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND x.pt_cd = 'FF'\n"
                    - "GROUP BY p.nm_full\n"
                    - "HAVING COUNT(*) >= 200\n"
                    - "ORDER BY avg_ff_velo DESC\n"
                    - "LIMIT 1"
            - id: "ed77b5a7aa022077baf4058256d1d94c"
              question:
                - "How did we do in one-run games? Wins and losses"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT SUM(CASE WHEN (g.hm_tm_id = ${var.team.id} AND g.hm_r > g.aw_r)\n"
                    - "                  OR (g.aw_tm_id = ${var.team.id} AND g.aw_r > g.hm_r) THEN 1 ELSE 0 END) AS wins,\n"
                    - "       SUM(CASE WHEN (g.hm_tm_id = ${var.team.id} AND g.hm_r < g.aw_r)\n"
                    - "                  OR (g.aw_tm_id = ${var.team.id} AND g.aw_r < g.hm_r) THEN 1 ELSE 0 END) AS losses\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.gm g\n"
                    - "WHERE g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND ${var.team.id} IN (g.hm_tm_id, g.aw_tm_id)\n"
                    - "  AND ABS(g.hm_r - g.aw_r) = 1"
            - id: "ee05854657f180ab0bc42ccb21715a8b"
              question:
                - "Home and road ERA split for the ${var.team.short_name} staff"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT CASE WHEN g.hm_tm_id = ${var.team.id} THEN 'Home' ELSE 'Road' END AS home_road,\n"
                    - "       ROUND(9 * SUM(l.er) / (SUM(l.outs) / 3.0), 2) AS era\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "GROUP BY 1\n"
                    - "ORDER BY 1"
            - id: "ee2f56d104e55551f252ae918b5d27d5"
              question:
                - "Our staff's swing-and-miss rate on sweepers"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(100.0 * SUM(CASE WHEN x.cd IN ('S','W','M') THEN 1 ELSE 0 END)\n"
                    - "                   / SUM(CASE WHEN x.cd IN ('S','W','T','F','L','M','O','X','D','E') THEN 1 ELSE 0 END), 1) AS whiff_pct\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND x.pt_cd = 'ST'"
