        benchmarks:
          questions:
            - id: "0e8c7b8bd1ff825fee09b91d6a843302"
              question:
                - "Top 5 ${var.team.short_name} relievers by strikeout rate in August, minimum 25 batters faced"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT p.nm_full AS pitcher,\n"
                    - "       ROUND(100.0 * SUM(l.so) / SUM(l.bf), 1) AS k_pct\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.plyr p ON l.p_id = p.p_id\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND l.gs = 0\n"
                    - "  AND MONTH(g.gm_dt) = 8\n"
                    - "GROUP BY p.nm_full\n"
                    - "HAVING SUM(l.bf) >= 25\n"
                    - "ORDER BY k_pct DESC, pitcher\n"
                    - "LIMIT 5"
            - id: "11317e5ca076b590b878e5e1fedf56eb"
              question:
                - "How many strikeouts did ${var.team.short_name} pitchers get on sweepers this season?"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT COUNT(*) AS sweeper_strikeouts\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND x.pt_cd = 'ST'\n"
                    - "  AND x.is_lst = true\n"
                    - "  AND x.ev_typ IN ('strikeout', 'strikeout_double_play')"
            - id: "2ca80035f134865fce36fb3386baae29"
              question:
                - "Which of our relievers had the best K% in August? Min 25 batters faced, top 5"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT p.nm_full AS pitcher,\n"
                    - "       ROUND(100.0 * SUM(l.so) / SUM(l.bf), 1) AS k_pct\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.plyr p ON l.p_id = p.p_id\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND l.gs = 0\n"
                    - "  AND MONTH(g.gm_dt) = 8\n"
                    - "GROUP BY p.nm_full\n"
                    - "HAVING SUM(l.bf) >= 25\n"
                    - "ORDER BY k_pct DESC, pitcher\n"
                    - "LIMIT 5"
            - id: "2e203e363deb0b1648a68ae9c4ee33de"
              question:
                - "What was the whiff rate on sweepers thrown by ${var.team.short_name} pitchers this season?"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(100.0 * SUM(CASE WHEN x.cd IN ('S','W','M') THEN 1 ELSE 0 END)\n"
                    - "                   / SUM(CASE WHEN x.cd IN ('S','W','T','F','L','M','O','X','D','E') THEN 1 ELSE 0 END), 1) AS whiff_pct\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND x.pt_cd = 'ST'"
            - id: "5465eb7f8f79883f373f60d36c122d74"
              question:
                - "${var.team.short_name} staff ERA ${var.season}"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(9 * SUM(l.er) / (SUM(l.outs) / 3.0), 2) AS team_era\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}"
            - id: "561d9af6be196f1d0cc8edd1d3547691"
              question:
                - "Who led our rotation in quality starts?"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT p.nm_full AS pitcher,\n"
                    - "       COUNT(*) AS quality_starts\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.plyr p ON l.p_id = p.p_id\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND l.gs = 1 AND l.outs >= 18 AND l.er <= 3\n"
                    - "GROUP BY p.nm_full\n"
                    - "ORDER BY quality_starts DESC, pitcher\n"
                    - "LIMIT 1"
            - id: "58b6e938bb799dcc2a03b7b08e6cf1a9"
              question:
                - "How did our relievers do in games decided by one run?"
              answer:
