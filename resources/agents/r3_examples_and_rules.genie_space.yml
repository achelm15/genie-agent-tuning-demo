          sql_snippets:
            filters:
              - id: "c85b34602ef97f7096e7d19608a04970"
                display_name: "Regular season"
                sql:
                  - "`gm`.`gm_typ` = 'R'"
                synonyms:
                  - "this season"
                  - "this year"
                  - "regular season"
                  - "season"
                  - "${var.season} season"
                comment:
                  - "Regular season games only, no spring training. In the metric views the same filter is Game Type = 'Regular season'."
          example_question_sqls:
            - id: "2dec42b323f36bb342bead4b310622e9"
              question:
                - "What pitches did our staff use to finish strikeouts?"
              sql:
                - "-- Count plate appearance outcomes on the last pitch only (is_lst), or every pitch of the at-bat gets counted.\n"
                - "SELECT CASE x.pt_cd\n"
                - "         WHEN 'FF' THEN 'Four-seam fastball' WHEN 'SI' THEN 'Sinker' WHEN 'FC' THEN 'Cutter'\n"
                - "         WHEN 'SL' THEN 'Slider' WHEN 'ST' THEN 'Sweeper' WHEN 'SV' THEN 'Slurve'\n"
                - "         WHEN 'CU' THEN 'Curveball' WHEN 'KC' THEN 'Knuckle curve' WHEN 'CH' THEN 'Changeup'\n"
                - "         WHEN 'FS' THEN 'Splitter' ELSE x.pt_cd END AS pitch_type,\n"
                - "       COUNT(*) AS strikeouts,\n"
                - "       ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS share_pct\n"
                - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                - "  AND x.is_lst\n"
                - "  AND x.ev_typ IN ('strikeout', 'strikeout_double_play')\n"
                - "GROUP BY 1\n"
                - "ORDER BY strikeouts DESC"
            - id: "34847a20defc826d738acfd69b9faa09"
              question:
                - "How did our bullpen do in close games?"
              sql:
                - "-- Close game = final margin of 2 runs or fewer. Relievers = gs = 0. Regular season only.\n"
                - "SELECT ROUND(SUM(l.outs) / 3.0, 1) AS innings,\n"
                - "       ROUND(9 * SUM(l.er) / (SUM(l.outs) / 3.0), 2) AS era,\n"
                - "       ROUND((SUM(l.bb) + SUM(l.h)) / (SUM(l.outs) / 3.0), 2) AS whip,\n"
                - "       ROUND(100.0 * SUM(l.so) / SUM(l.bf), 1) AS k_pct,\n"
                - "       ROUND(100.0 * SUM(l.bb) / SUM(l.bf), 1) AS bb_pct\n"
                - "FROM ${var.catalog}.${var.tuned_schema}.pgl l\n"
                - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                - "  AND l.gs = 0\n"
                - "  AND ABS(g.hm_r - g.aw_r) <= 2"
            - id: "4be15a3705ff325e9d8e95b83762c28d"
              question:
                - "Which of our starters pitched deepest into games?"
              sql:
                - "-- Innings = outs / 3. Quality start = 6+ innings and 3 or fewer earned runs.\n"
                - "SELECT p.nm_full AS pitcher,\n"
                - "       COUNT(*) AS starts,\n"
                - "       ROUND(SUM(l.outs) / 3.0 / COUNT(*), 2) AS innings_per_start,\n"
                - "       COUNT_IF(l.outs >= 18 AND l.er <= 3) AS quality_starts,\n"
                - "       ROUND(9 * SUM(l.er) / (SUM(l.outs) / 3.0), 2) AS era\n"
                - "FROM ${var.catalog}.${var.tuned_schema}.pgl l\n"
                - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                - "JOIN ${var.catalog}.${var.tuned_schema}.plyr p ON l.p_id = p.p_id\n"
                - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                - "  AND l.gs = 1\n"
                - "GROUP BY p.nm_full\n"
                - "HAVING COUNT(*) >= 5\n"
                - "ORDER BY innings_per_start DESC"
            - id: "a85e82c541e5a6e024b6db85c5ce7fde"
              question:
                - "What does ${var.team.pitcher}'s arsenal look like?"
              sql:
                - "SELECT CASE x.pt_cd\n"
                - "         WHEN 'FF' THEN 'Four-seam fastball' WHEN 'SI' THEN 'Sinker' WHEN 'FC' THEN 'Cutter'\n"
                - "         WHEN 'SL' THEN 'Slider' WHEN 'ST' THEN 'Sweeper' WHEN 'SV' THEN 'Slurve'\n"
                - "         WHEN 'CU' THEN 'Curveball' WHEN 'KC' THEN 'Knuckle curve' WHEN 'CH' THEN 'Changeup'\n"
                - "         WHEN 'FS' THEN 'Splitter' ELSE x.pt_cd END AS pitch_type,\n"
                - "       COUNT(*) AS pitches,\n"
                - "       ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS usage_pct,\n"
                - "       ROUND(AVG(x.spd), 1) AS avg_velo,\n"
                - "       ROUND(AVG(x.spn), 0) AS avg_spin,\n"
                - "       ROUND(AVG(x.ivb), 1) AS avg_ivb,\n"
                - "       ROUND(AVG(x.hb), 1) AS avg_hb,\n"
                - "       ROUND(100.0 * COUNT_IF(x.cd IN ('S','W','M'))\n"
                - "             / NULLIF(COUNT_IF(x.cd IN ('S','W','T','F','L','M','O','X','D','E')), 0), 1) AS whiff_pct\n"
                - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                - "JOIN ${var.catalog}.${var.tuned_schema}.plyr p ON x.p_id = p.p_id\n"
                - "WHERE p.nm_full ILIKE CONCAT('%', :pitcher_name, '%')\n"
                - "  AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                - "GROUP BY 1\n"
                - "ORDER BY pitches DESC"
              parameters:
                - name: "pitcher_name"
                  type_hint: "STRING"
                  description:
                    - "Part of the pitcher name, for example ${var.team.pitcher}"
          text_instructions:
            - id: "a4f86f7bfc24194b276c22e0ef158197"
              content:
                - "- This agent covers the ${var.team.name} pitching staff. \"We\", \"us\" and \"our\" mean the ${var.team.short_name} (team ID ${var.team.id}, ${var.team.abbreviation}).\n"
                - "- Use the ${var.season} regular season unless someone asks for spring training or another period: filter Game Type = 'Regular season' (gm_typ = 'R'). That applies to \"this season\", \"this year\", \"in ${var.season}\", and to questions that don't mention a period at all.\n"
                - "- The bullpen means relief appearances: Role = 'Reliever' in the metric views, gs = 0 in pgl. The rotation means starts: Role = 'Starter', gs = 1. Use these exact values, not a pattern match.\n"
                - "- For any KPI defined in pitching_metrics or pitch_metrics (ERA, WHIP, K%, BB%, whiff rate, hard-hit rate, velocity and others), use the metric view measure rather than recalculating it.\n"
                - "- Round in the final SELECT: ROUND(x, 2) for ERA, WHIP and HR/9; ROUND(x, 1) for innings, velocity and every rate. Rates are percentages from 0 to 100.\n"
                - "- Answer like a major league pitching analyst briefing the ${var.team.name} front office: plain baseball language, the way you'd explain it in a meeting, for a baseball audience rather than a technical one. When the answer is a single number, give it in one sentence that names the team, the stat and the period. For comparisons, rankings, splits and trends, lead with the main takeaway, then walk through the numbers that matter and what they mean for the staff, and show a chart when it makes the comparison easier to see. Don't explain how the answer was produced: no list of filters, no field = value pairs, no column, table or metric view names, and no description of the result set such as \"the single result returned\" or \"based on the result shown\".\n"
                - "- If someone asks for the \"best\" or \"worst\" pitcher without saying how to measure it, ask which stat they mean (ERA, K%, whiff rate or another stat) before answering."
          sql_functions:
            - id: "f585263d99e602524497b62208c89d29"
              identifier: "${var.catalog}.${var.tuned_schema}.pitcher_season_line"
        benchmarks:
          questions:
            - id: "0cf807fa297268fc8456558afd64805d"
              question:
                - "Number of punchouts our staff recorded with a sweeper"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT COUNT(*) AS sweeper_strikeouts\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND x.pt_cd = 'ST'\n"
                    - "  AND x.is_lst = true\n"
                    - "  AND x.ev_typ IN ('strikeout', 'strikeout_double_play')"
            - id: "2375800ea30e73fd71444e0795908792"
              question:
                - "Home and road ERA split for the ${var.team.short_name} staff"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT CASE WHEN g.hm_tm_id = ${var.team.id} THEN 'Home' ELSE 'Road' END AS home_road,\n"
                    - "       ROUND(9 * SUM(l.er) / (SUM(l.outs) / 3.0), 2) AS era\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "GROUP BY 1\n"
                    - "ORDER BY 1"
            - id: "291861b6c2a6ec0a1290db419f033914"
              question:
                - "What was the ${var.team.short_name}' record in one-run games this season?"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT SUM(CASE WHEN (g.hm_tm_id = ${var.team.id} AND g.hm_r > g.aw_r)\n"
                    - "                  OR (g.aw_tm_id = ${var.team.id} AND g.aw_r > g.hm_r) THEN 1 ELSE 0 END) AS wins,\n"
                    - "       SUM(CASE WHEN (g.hm_tm_id = ${var.team.id} AND g.hm_r < g.aw_r)\n"
                    - "                  OR (g.aw_tm_id = ${var.team.id} AND g.aw_r < g.hm_r) THEN 1 ELSE 0 END) AS losses\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.gm g\n"
                    - "WHERE g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND ${var.team.id} IN (g.hm_tm_id, g.aw_tm_id)\n"
                    - "  AND ABS(g.hm_r - g.aw_r) = 1"
            - id: "3f7f9b53973848c4f89dfee40a15f18d"
              question:
                - "${var.team.short_name} sweeper whiff %"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(100.0 * SUM(CASE WHEN x.cd IN ('S','W','M') THEN 1 ELSE 0 END)\n"
                    - "                   / SUM(CASE WHEN x.cd IN ('S','W','T','F','L','M','O','X','D','E') THEN 1 ELSE 0 END), 1) AS whiff_pct\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
