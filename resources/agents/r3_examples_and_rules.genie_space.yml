            - id: "7961dde0c548462f6b1cad122b2d5df7"
              question:
                - "Top 5 ${var.team.short_name} relievers by strikeout rate in August, minimum 25 batters faced"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT p.nm_full AS pitcher,\n"
                    - "       ROUND(100.0 * SUM(l.so) / SUM(l.bf), 1) AS k_pct\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.plyr p ON l.p_id = p.p_id\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND l.gs = 0\n"
                    - "  AND MONTH(g.gm_dt) = 8\n"
                    - "GROUP BY p.nm_full\n"
                    - "HAVING SUM(l.bf) >= 25\n"
                    - "ORDER BY k_pct DESC, pitcher\n"
                    - "LIMIT 5"
            - id: "8c0fff3e9364346c56c66b8f020bb381"
              question:
                - "How did we do in one-run games? Wins and losses"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT SUM(CASE WHEN (g.hm_tm_id = ${var.team.id} AND g.hm_r > g.aw_r)\n"
                    - "                  OR (g.aw_tm_id = ${var.team.id} AND g.aw_r > g.hm_r) THEN 1 ELSE 0 END) AS wins,\n"
                    - "       SUM(CASE WHEN (g.hm_tm_id = ${var.team.id} AND g.hm_r < g.aw_r)\n"
                    - "                  OR (g.aw_tm_id = ${var.team.id} AND g.aw_r < g.hm_r) THEN 1 ELSE 0 END) AS losses\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.gm g\n"
                    - "WHERE g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND ${var.team.id} IN (g.hm_tm_id, g.aw_tm_id)\n"
                    - "  AND ABS(g.hm_r - g.aw_r) = 1"
