          sql_snippets:
            filters:
              - id: "c85b34602ef97f7096e7d19608a04970"
                display_name: "Regular season"
                sql:
                  - "`gm`.`gm_typ` = 'R'"
                synonyms:
                  - "this season"
                  - "this year"
                  - "regular season"
                  - "season"
                  - "${var.season} season"
                comment:
                  - "Regular season games only, no spring training. In the metric views the same filter is Game Type = 'Regular season'."
        benchmarks:
          questions:
            - id: "156eec06218a60db0169bcdacb5deb58"
              question:
                - "${var.team.short_name} staff ERA ${var.season}"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(9 * SUM(l.er) / (SUM(l.outs) / 3.0), 2) AS team_era\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}"
            - id: "1ce2863736ddd3921b6dcd2bc7adf0c1"
              question:
                - "How did we do in one-run games? Wins and losses"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT SUM(CASE WHEN (g.hm_tm_id = ${var.team.id} AND g.hm_r > g.aw_r)\n"
                    - "                  OR (g.aw_tm_id = ${var.team.id} AND g.aw_r > g.hm_r) THEN 1 ELSE 0 END) AS wins,\n"
                    - "       SUM(CASE WHEN (g.hm_tm_id = ${var.team.id} AND g.hm_r < g.aw_r)\n"
                    - "                  OR (g.aw_tm_id = ${var.team.id} AND g.aw_r < g.hm_r) THEN 1 ELSE 0 END) AS losses\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.gm g\n"
                    - "WHERE g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND ${var.team.id} IN (g.hm_tm_id, g.aw_tm_id)\n"
                    - "  AND ABS(g.hm_r - g.aw_r) = 1"
            - id: "3191f2132872aed3ec6ed5312ceb26e6"
              question:
                - "Who threw the hardest four-seamer on our staff on average (at least 200 thrown)?"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT p.nm_full AS pitcher,\n"
                    - "       ROUND(AVG(x.spd), 1) AS avg_ff_velo\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.plyr p ON x.p_id = p.p_id\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND x.pt_cd = 'FF'\n"
                    - "GROUP BY p.nm_full\n"
                    - "HAVING COUNT(*) >= 200\n"
                    - "ORDER BY avg_ff_velo DESC\n"
                    - "LIMIT 1"
            - id: "339f5106c1652b1e6d712a56ffa7d1c2"
              question:
                - "What was the ${var.team.short_name}' record in one-run games this season?"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT SUM(CASE WHEN (g.hm_tm_id = ${var.team.id} AND g.hm_r > g.aw_r)\n"
                    - "                  OR (g.aw_tm_id = ${var.team.id} AND g.aw_r > g.hm_r) THEN 1 ELSE 0 END) AS wins,\n"
                    - "       SUM(CASE WHEN (g.hm_tm_id = ${var.team.id} AND g.hm_r < g.aw_r)\n"
                    - "                  OR (g.aw_tm_id = ${var.team.id} AND g.aw_r < g.hm_r) THEN 1 ELSE 0 END) AS losses\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.gm g\n"
                    - "WHERE g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND ${var.team.id} IN (g.hm_tm_id, g.aw_tm_id)\n"
                    - "  AND ABS(g.hm_r - g.aw_r) = 1"
            - id: "391f5fda30567eb50b4921b6d1d32248"
              question:
                - "What was the whiff rate on sweepers thrown by ${var.team.short_name} pitchers this season?"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(100.0 * SUM(CASE WHEN x.cd IN ('S','W','M') THEN 1 ELSE 0 END)\n"
                    - "                   / SUM(CASE WHEN x.cd IN ('S','W','T','F','L','M','O','X','D','E') THEN 1 ELSE 0 END), 1) AS whiff_pct\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND x.pt_cd = 'ST'"
            - id: "447ec8892b6d44ac995e8fadf22e4b66"
              question:
                - "How did our relievers do in games decided by one run?"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(9 * SUM(l.er) / (SUM(l.outs) / 3.0), 2) AS bullpen_era\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND l.gs = 0\n"
                    - "  AND ABS(g.hm_r - g.aw_r) = 1"
            - id: "5e1aef38ab67e15a04d979043510b5da"
              question:
                - "Our staff's swing-and-miss rate on sweepers"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(100.0 * SUM(CASE WHEN x.cd IN ('S','W','M') THEN 1 ELSE 0 END)\n"
                    - "                   / SUM(CASE WHEN x.cd IN ('S','W','T','F','L','M','O','X','D','E') THEN 1 ELSE 0 END), 1) AS whiff_pct\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND x.pt_cd = 'ST'"
            - id: "6c4c384d00e73c527e64f5498fd04a6b"
              question:
                - "Which ${var.team.short_name} starter had the most quality starts this season?"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT p.nm_full AS pitcher,\n"
                    - "       COUNT(*) AS quality_starts\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.plyr p ON l.p_id = p.p_id\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND l.gs = 1 AND l.outs >= 18 AND l.er <= 3\n"
                    - "GROUP BY p.nm_full\n"
                    - "ORDER BY quality_starts DESC, pitcher\n"
                    - "LIMIT 1"
            - id: "754d4cff8a88258b0add4ff5cfda11d5"
              question:
                - "${var.team.short_name} sweeper whiff %"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(100.0 * SUM(CASE WHEN x.cd IN ('S','W','M') THEN 1 ELSE 0 END)\n"
                    - "                   / SUM(CASE WHEN x.cd IN ('S','W','T','F','L','M','O','X','D','E') THEN 1 ELSE 0 END), 1) AS whiff_pct\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND x.pt_cd = 'ST'"
            - id: "78ae18943c33d096c61044628acdb64b"
              question:
                - "Hard-hit % against our pitchers at ${var.team.home_park} this season"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT ROUND(100.0 * SUM(CASE WHEN x.ev >= 95 THEN 1 ELSE 0 END) / COUNT(*), 1) AS hard_hit_pct\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND g.hm_tm_id = ${var.team.id}\n"
                    - "  AND x.cd IN ('X','D','E')\n"
                    - "  AND x.ev IS NOT NULL"
            - id: "7a5cfc50490c25cff1c659757c0aef80"
              question:
                - "${var.team.short_name} ERA at home vs on the road this season"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT CASE WHEN g.hm_tm_id = ${var.team.id} THEN 'Home' ELSE 'Road' END AS home_road,\n"
                    - "       ROUND(9 * SUM(l.er) / (SUM(l.outs) / 3.0), 2) AS era\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pgl l\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON l.gm_pk = g.gm_pk\n"
                    - "WHERE l.tm_id = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "GROUP BY 1\n"
                    - "ORDER BY 1"
            - id: "7ae75a7284b1530664974c916e669555"
              question:
                - "Number of punchouts our staff recorded with a sweeper"
              answer:
                - format: "SQL"
                  content:
                    - "SELECT COUNT(*) AS sweeper_strikeouts\n"
                    - "FROM ${var.catalog}.${var.tuned_schema}.pch x\n"
                    - "JOIN ${var.catalog}.${var.tuned_schema}.gm g ON x.gm_pk = g.gm_pk\n"
                    - "WHERE x.fld_tm = ${var.team.id} AND g.gm_typ = 'R' AND g.ssn = ${var.season}\n"
                    - "  AND x.pt_cd = 'ST'\n"
                    - "  AND x.is_lst = true\n"
                    - "  AND x.ev_typ IN ('strikeout', 'strikeout_double_play')"
            - id: "8294d7f206c0ffec9b2408c71affc336"
              question:
                - "Bullpen ERA in one-run games this season"
              answer:
                - format: "SQL"
                  content:
